<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabella Google Sheet</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        img { max-width: 200px; height: auto; }
    </style>
</head>
<body>
    <h1>Tabella in Tempo Reale</h1>
    <table id="dataTable">
        <thead>
            <tr>
                <!-- Adatta alle tue colonne -->
                <th>Colonna1</th>
                <th>Colonna2</th>
                <th>Immagine2</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const spreadsheetId = 'https://docs.google.com/spreadsheets/d/11G8nsileMwydMZYbftLcPN84ljb3yP_W3fTjRwmKm3Q/edit?gid=0#gid=0'; // Sostituisci con l'ID del tuo Sheet
        const range = 'Foglio1'; // Es. 'Sheet1!A:Z' per tutte le colonne
        const apiKey = 'AIzaSyBRGwZgpNGnXgzO0dMUJI52P2E6FtThCPE'; // Sostituisci con la tua API key

        async function fetchData() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=${apiKey}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Errore API: ' + response.status);
                const data = await response.json();
                const rows = data.values;

                const tableBody = document.querySelector('#dataTable tbody');
                tableBody.innerHTML = ''; // Pulisci tabella

                rows.forEach((row, index) => {
                    if (index === 0) return; // Salta header
                    const tr = document.createElement('tr');
                    row.forEach((cell, colIndex) => {
                        const td = document.createElement('td');
                        if (colIndex === 3) { // Colonna "URL Diretto" (es. D=3)
                            if (cell) {
                                const img = document.createElement('img');
                                img.src = cell; // Usa l'URL diretto
                                img.alt = 'Immagine';
                                td.appendChild(img);
                            }
                        } else {
                            td.textContent = cell || '';
                        }
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                });
            } catch (error) {
                console.error('Errore:', error);
                document.querySelector('#dataTable tbody').innerHTML = '<tr><td colspan="3">Errore caricamento dati</td></tr>';
            }
        }

        // Carica dati all'avvio
        fetchData();

        // Refresh ogni 60 secondi
        setInterval(fetchData, 60000);
    </script>
</body>
</html>
