<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabella Google Sheet</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        img { max-width: 200px; height: auto; display: block; }
    </style>
</head>
<body>
    <h1>Tabella in Tempo Reale</h1>
    <button onclick="fetchData()">Aggiorna</button>
    <table id="dataTable">
        <thead>
            <tr>
                <th>Modello</th>
                <th>File</th>
                <th>Descrizione</th>
                <th>Prezzo</th>
                <th>Immagine</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const spreadsheetId = '11G8nsileMwydMZYbftLcPN84ljb3yP_W3fTjRwmKm3Q';
        const range = 'Foglio1!A:Z';
        const apiKey = 'AIzaSyBRGwZgpNGnXgzO0dMUJI52P2E6FtThCPE';

        // 🔧 URL base del sito GitHub Pages (stesso repo dove c'è index.html)
        // Es: https://tuonome.github.io/tuorepo/images/
        const githubImagesBase = window.location.origin + '/images/';

        async function fetchData() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=${apiKey}`;
            console.log('Fetching:', url);

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Errore API: ${response.status} ${response.statusText}`);

                const data = await response.json();
                const rows = data.values || [];
                const tableBody = document.querySelector('#dataTable tbody');
                tableBody.innerHTML = '';

                rows.forEach((row, index) => {
                    if (index === 0) return; // salta intestazione
                    const tr = document.createElement('tr');

                    // Mostra le prime 4 colonne (o meno se mancano dati)
                    for (let i = 0; i < 4; i++) {
                        const td = document.createElement('td');
                        td.textContent = row[i] || '';
                        tr.appendChild(td);
                    }

                    // 🔧 Crea la cella immagine
                    const imgTd = document.createElement('td');
                    let fullPath = row[1] || ''; // seconda colonna
                    let fileName = fullPath.split('/').pop().trim(); // prendi solo nomefile.ext

                    if (fileName) {
                        const imgUrl = githubImagesBase + encodeURIComponent(fileName);
                        const img = document.createElement('img');
                        img.src = imgUrl;
                        img.alt = fileName;
                        img.onerror = () => {
                            console.warn('Immagine non trovata:', imgUrl);
                            imgTd.textContent = 'Immagine non disponibile';
                        };
                        imgTd.appendChild(img);
                    } else {
                        imgTd.textContent = 'Nessuna immagine';
                    }

                    tr.appendChild(imgTd);
                    tableBody.appendChild(tr);
                });

            } catch (error) {
                console.error('Errore:', error);
                document.querySelector('#dataTable tbody').innerHTML =
                    `<tr><td colspan="5">Errore: ${error.message}</td></tr>`;
            }
        }

        // Carica subito
        fetchData();
    </script>
</body>
</html>
